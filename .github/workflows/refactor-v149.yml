name: Refactor MDADM Manager v1.49

on:
  push:
    paths:
      - "tools/refactor_v149.py"
      - ".github/workflows/refactor-v149.yml"

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[skip refactor-v149]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/refactor_v149.py
      - run: python3 -m compileall -q mdadm_matrix mdadm_manager_v1.49.py
      - name: Verify no French source comments remain
        run: |
          python3 - <<'PY'
          import io, pathlib, re, tokenize
          french = re.compile(r"[àâçéèêëîïôûùüÿœ]|\b(affiche|ajoute|analyse|avant|commande|création|démarrage|disque|données|fenêtre|fichier|langue|membre|périphérique|rafraîch|remplacement|retourne|sauvegarde|sélection|système|vérifie)\b", re.I)
          bad=[]
          for path in pathlib.Path('mdadm_matrix').glob('*.py'):
              for tok in tokenize.generate_tokens(io.StringIO(path.read_text(encoding='utf-8')).readline):
                  if tok.type==tokenize.COMMENT and french.search(tok.string): bad.append(f"{path}:{tok.start[0]}: {tok.string}")
          if bad: raise SystemExit("French comments remain:\n"+"\n".join(bad))
          PY
      - name: Commit refactored v1.49
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refactor v1.49 into modules and keep English-only code comments [skip refactor-v149]"
          git push
